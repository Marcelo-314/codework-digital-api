spring:
  application:
    name: cwd-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    error:
      include-exception: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: ${SERVER_MAX_HTTP_REQUEST_HEADER_SIZE:8KB}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never

cwd:
  admin:
    username: ${CWD_ADMIN_USERNAME}
    password: ${CWD_ADMIN_PASSWORD}
  process-analysis:
    demo-enabled: ${PROCESS_ANALYSIS_DEMO_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${PROCESS_ANALYSIS_MODEL:}
    responses-url: ${PROCESS_ANALYSIS_RESPONSES_URL:https://api.openai.com/v1/responses}
    connect-timeout: ${PROCESS_ANALYSIS_CONNECT_TIMEOUT:2s}
    request-timeout: ${PROCESS_ANALYSIS_REQUEST_TIMEOUT:8s}
  web:
    allowed-origins: ${CWD_ALLOWED_ORIGINS}
    cors-max-age: ${CWD_CORS_MAX_AGE:1h}
    max-contact-request-bytes: ${CWD_MAX_CONTACT_REQUEST_BYTES:65536}
  turnstile:
    secret-key: ${TURNSTILE_SECRET_KEY}
    siteverify-url: ${TURNSTILE_SITEVERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    allowed-hostnames: ${TURNSTILE_ALLOWED_HOSTNAMES}
    home-action: ${TURNSTILE_HOME_ACTION:contact_home}
    contact-page-action: ${TURNSTILE_CONTACT_PAGE_ACTION:contact_page}
    connect-timeout: ${TURNSTILE_CONNECT_TIMEOUT:2s}
    request-timeout: ${TURNSTILE_REQUEST_TIMEOUT:4s}
